name: Notify infra deploy

# The ONLY Commit-Capital-specific workflow on this fork (everything else here is
# upstream paperclipai/paperclip's). When the deployed branch (commit-capital)
# changes, tell the infra repo (commit-capital/commit-cloud-paperclip-setup) to run
# its deploy workflow via repository_dispatch.
#
# This file lives only on the commit-capital branch. A reset-to-master rebuild of
# commit-capital will drop it — re-add it before force-pushing (see the infra repo
# README's "Rebuilding commit-capital" section).

on:
  push:
    branches: [commit-capital]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy to infra repo
        env:
          TOKEN: ${{ secrets.INFRA_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::INFRA_DEPLOY_DISPATCH_TOKEN secret not set — skipping deploy dispatch."
            echo "Add a fine-grained PAT (Contents: write on commit-cloud-paperclip-setup) as"
            echo "that repo secret to enable auto-deploy on commit-capital pushes."
            exit 0
          fi
          http_code=$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/commit-capital/commit-cloud-paperclip-setup/dispatches \
            -d '{"event_type":"fork-commit-capital-updated","client_payload":{"sha":"${{ github.sha }}"}}')
          echo "Dispatch HTTP $http_code"
          if [ "$http_code" != "204" ]; then
            echo "::error::repository_dispatch failed (HTTP $http_code):"
            cat /tmp/resp
            exit 1
          fi
          echo "✓ Deploy dispatched to commit-cloud-paperclip-setup"
